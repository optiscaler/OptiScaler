name: FFX DX12 build and timer regression
on:
  workflow_dispatch:
  push:
    paths:
      - OptiScaler/upscalers/ffx/FFXFeature_Dx12.cpp
      - tests/test_drs_timer.py
      - .github/workflows/ffx-dx12-regression.yml
  pull_request:
    paths:
      - OptiScaler/upscalers/ffx/FFXFeature_Dx12.cpp
      - tests/test_drs_timer.py
      - .github/workflows/ffx-dx12-regression.yml
permissions:
  contents: read
jobs:
  timer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Compile and run production timer regression
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSROOT=%%i"
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          python tests\test_drs_timer.py
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /EHsc tests\drs_timer.cpp /Fe:tests\drs_timer.exe
          if errorlevel 1 exit /b 1
          tests\drs_timer.exe
          if errorlevel 1 exit /b 1
      - uses: microsoft/setup-msbuild@v2
      - name: Build Release x64
        run: msbuild OptiScaler.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
      - name: Upload Release DLL
        uses: actions/upload-artifact@v4
        with:
          name: FFX-DX12-Release
          path: x64/Release/a/OptiScaler.dll
          if-no-files-found: error
