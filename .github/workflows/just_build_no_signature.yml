# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build (No Signing)

on:
  workflow_dispatch:
#  push:
#    branches: [ "master" ]
#  pull_request:
#    branches: [ "master" ]
    
env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

  # BaBa Neural sharpening shader, source is OptiScaler/shaders/rcas/precompile/<name>.hlsl
  BABA_SHADER: baba_neural_sharpen

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    environment: Build

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'true'
        
    # BaBa Neural is built with the dxc / fxc from shader_tools, using the same scripts as the other shaders.
    # The headers they make are picked up by the __has_include checks in RCAS_Dx12.cpp, RCAS_Dx11.cpp and RCAS_Vk.cpp
    #   Dx12   -> <name>_Shader.h       (dxc, cs_6_0)
    #   Dx11   -> <name>_Shader_Dx11.h  (fxc, cs_5_0)
    #   Vulkan -> <name>_Shader_Vk.h    (dxc, spir-v)
    - name: Build BaBa Neural shaders (Dx12, Dx11, Vulkan)
      working-directory: OptiScaler/shaders/rcas/precompile
      shell: cmd
      run: |
        python --version || exit /b 1
        call ..\..\shader_tools\build_precompiled_shader.bat ${{ env.BABA_SHADER }} || exit /b 1
        call ..\..\shader_tools\build_precompiled_shader_vk.bat ${{ env.BABA_SHADER }} || exit /b 1

    # The scripts don't stop when dxc / fxc fail, so check what they made
    - name: Check BaBa Neural shaders
      working-directory: OptiScaler/shaders/rcas/precompile
      shell: python
      run: |
        import pathlib, sys

        name = "${{ env.BABA_SHADER }}"

        # bytecode, header made from it, first bytes of a valid bytecode
        outputs = [
            (f"{name}_Shader.cso", f"{name}_Shader.h", b"DXBC"),  # Dx12 (dxil)
            (f"{name}_Shader_Dx11.cso", f"{name}_Shader_Dx11.h", b"DXBC"),  # Dx11 (dxbc)
            (f"{name}_Shader_Vk.spv", f"{name}_Shader_Vk.h", bytes([0x03, 0x02, 0x23, 0x07])),  # Vulkan (spir-v)
        ]

        ok = True
        for binary, header, magic in outputs:
            b, h = pathlib.Path(binary), pathlib.Path(header)

            if not b.is_file() or not h.is_file():
                print(f"::error::{binary} or {header} was not generated")
                ok = False
            elif not b.read_bytes().startswith(magic):
                print(f"::error::{binary} is not a valid shader")
                ok = False
            else:
                print(f"{binary}: {b.stat().st_size} bytes -> {header}")

        sys.exit(0 if ok else 1)

    - name: Extract Version
      id: get_version
      working-directory: ${{ github.workspace }}
      shell: powershell
      run: |
        # Ensure the file exists before proceeding
        $resourceFile = ".\OptiScaler\resource.h"
        if (-Not (Test-Path $resourceFile)) {
            Write-Error "File not found: $resourceFile"
            exit 1
        }
        
        # Helper function to extract the first matching line for a version component
        function Get-Version-Component {
            param (
                [string]$pattern,
                [string]$replacement
            )
            # Use Select-String and take only the first match
            $line = Get-Content $resourceFile | Select-String -Pattern $pattern | Select-Object -First 1
            if ($line) {
                return ($line.Line -replace $replacement).Trim()
            } else {
                Write-Error "Pattern not found: $pattern"
                exit 1
            }
        }
        
        # Extract version components (only the first match for each pattern)
        $majorVersion = Get-Version-Component 'VER_MAJOR_VERSION' '#define VER_MAJOR_VERSION\s+'
        $minorVersion = Get-Version-Component 'VER_MINOR_VERSION' '#define VER_MINOR_VERSION\s+'
        $hotfixVersion = Get-Version-Component 'VER_HOTFIX_VERSION' '#define VER_HOTFIX_VERSION\s+'
        $buildVersion = Get-Version-Component 'VER_BUILD_NUMBER' '#define VER_BUILD_NUMBER\s+'
        
        # Merge into a single version string
        $version = "v$majorVersion.$minorVersion.$hotfixVersion-pre$buildVersion"
        
        # Get the current date in a specific format (e.g., YYYYMMDD)
        $date = Get-Date -Format "yyyyMMdd"
        
        # Construct the output filename with version and date
        $outputFileName = "OptiScaler_${version}_${date}"
        
        # Output the generated filename
        Write-Output "Generated Filename: $outputFileName"
        
        # Write outputs to GITHUB_OUTPUT
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "filename=$outputFileName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        
      continue-on-error: false
      
    - name: Debug Outputs
      run: |
        echo "Version: ${{ steps.get_version.outputs.version }}"
        echo "Filename: ${{ steps.get_version.outputs.filename }}"
        
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}} /verbosity:minimal
      
    # A missing header only makes the build quietly fall back to runtime compiling (Dx) or RCAS (Vulkan)
    - name: Check BaBa Neural is built into the dll
      shell: python
      run: |
        import pathlib, sys

        name = "${{ env.BABA_SHADER }}"
        precompile = pathlib.Path("OptiScaler/shaders/rcas/precompile")
        dlls = {d: d.read_bytes() for d in pathlib.Path("x64/Release/a").glob("*.dll")}

        if not dlls:
            print("::error::No dll in x64/Release/a")
            sys.exit(1)

        shaders = {
            "Dx12": f"{name}_Shader.cso",
            "Dx11": f"{name}_Shader_Dx11.cso",
            "Vulkan": f"{name}_Shader_Vk.spv",
        }

        ok = True
        for api, file in shaders.items():
            blob = (precompile / file).read_bytes()
            hits = [d.name for d, data in dlls.items() if blob in data]

            if hits:
                print(f"{api}: {file} ({len(blob)} bytes) is in {', '.join(hits)}")
            else:
                print(f"::error::{api}: {file} is not in the build")
                ok = False

        sys.exit(0 if ok else 1)

    - name: Compress the artifact 
      run: |
        $zipName = "${{ steps.get_version.outputs.filename }}.7z"
        7z a -r ${{ github.workspace }}\$zipName ${{ github.workspace }}\x64\Release\a\*.*

      continue-on-error: false
        
    - uses: actions/upload-artifact@v7.0.0
      with:
        name: '${{ steps.get_version.outputs.filename }}'
        path: '${{ github.workspace }}\${{ steps.get_version.outputs.filename }}.7z'
        archive: false
        compression-level: 0
        if-no-files-found: error
